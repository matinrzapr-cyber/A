<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Love Portal</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: #080711;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* کارت‌های شیشه‌ای VIP */
        .vip-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px 25px;
            border-radius: 28px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 10;
        }

        h2 {
            margin-bottom: 20px;
            color: #ff79c6;
            font-size: 22px;
            text-shadow: 0 0 10px rgba(255, 121, 198, 0.4);
        }

        .date-input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 121, 198, 0.4);
            border-radius: 14px;
            color: #fff;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        .btn-option {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 16px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .btn-option:hover {
            background: #ff79c6;
            color: #111;
            font-weight: bold;
        }

        .hidden { display: none !important; }

        .letter-box {
            line-height: 2;
            font-size: 16px;
            text-align: justify;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .feedback-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            min-height: 60px;
            position: relative;
        }

        .action-btn {
            padding: 12px 35px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            cursor: pointer;
            font-weight: bold;
        }

        #yes-btn {
            background-color: #2ecc71;
            color: white;
            position: absolute;
            right: 10%;
        }

        #no-btn {
            background-color: #ff5555;
            color: white;
            position: absolute;
            left: 10%;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-box {
            background: #151226;
            padding: 30px;
            border-radius: 24px;
            border: 2px solid #ff79c6;
            max-width: 380px;
            width: 85%;
            text-align: center;
        }

        #galaxy-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 200;
        }

        .galaxy-title {
            position: absolute;
            top: 35px;
            width: 100%;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 15px #ff79c6;
            z-index: 210;
        }

        /* متن اشاره‌گر به ماه */
        .moon-pointer {
            position: absolute;
            top: 50%;
            right: 10%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 215;
            background: rgba(255, 121, 198, 0.15);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 121, 198, 0.4);
        }

        .moon-pointer span {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .galaxy-subtext {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 16px 22px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            font-size: 16px;
            color: #f1f1f1;
            z-index: 210;
            transition: opacity 0.8s ease;
        }

        #moon-canvas { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- بخش ۱: صفحه قفل -->
    <div id="lock-card" class="vip-card">
        <h2>🔒 ورود به پورتال خاص</h2>
        <p style="font-size: 15px; color: #ccc;">تاریخ ورود را وارد کن:</p>
        <input type="text" id="lock-date-input" class="date-input" placeholder="مثلاً: 1402/06/15">
        <button id="unlock-btn" class="btn-option" style="background: #ff79c6; color: #000; font-weight: bold;">ورود ✨</button>
    </div>

    <!-- بخش ۲: سوالات -->
    <div id="quiz-card" class="vip-card hidden">
        <h2 id="question-text">سوال...</h2>
        <div id="options-container"></div>
    </div>

    <!-- بخش ۳: نامه -->
    <div id="letter-card" class="vip-card hidden">
        <h2>نامه ای برای تو ❤️</h2>
        <div class="letter-box" id="letter-content">
            <!-- متن نامه را اینجا بنویس -->
            آلمای قشنگم، مرسی که هستی...✨
        </div>
        <h3 style="font-size: 18px; margin-bottom: 10px;">خوشت اومد؟ 😉</h3>
        <div class="feedback-container">
            <button id="yes-btn" class="action-btn">آره 😍</button>
            <button id="no-btn" class="action-btn">نه 😜</button>
        </div>
    </div>

    <!-- بخش ۴: شوخی -->
    <div id="joke-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>شوخی کردی دیگه؟! 🤨😂</h2>
            <p style="margin: 15px 0; font-size: 16px; color: #ddd;">مگه دست خودته؟ باید خوشت بیاد! 😜❤️</p>
            <button id="modal-confirm-btn" class="btn-option" style="background: #ff79c6; color: #000; font-weight: bold;">باشه بابا آره! ❤️</button>
        </div>
    </div>

    <!-- بخش ۵: کهکشان و ماه 3D -->
    <div id="galaxy-screen" class="hidden">
        <div class="galaxy-title" id="main-title">من دورت بگردم عزیزم ❤️</div>
        
        <div class="moon-pointer">
            <span id="pointer-text">آلما (این تویی! ❤️)</span>
            <span style="font-size: 24px; color: #ff79c6;">👈</span>
        </div>

        <canvas id="moon-canvas"></canvas>
        <div id="galaxy-text" class="galaxy-subtext">...</div>
        
        <audio id="bg-music" loop preload="auto">
            <!-- لینک آهنگ دلخواهت را اینجا بگذار -->
            <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112181.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        // ==========================================
        // تنظیمات شخصی‌سازی
        // ==========================================
        
        // ۱. تاریخ صحیح قفل
        const CORRECT_DATE = "1402/06/15"; 

        // ۲. سوالات کویز
        const questions = [
            {
                question: "سوال اول: یادته اولین باری که باهم صحبت کردیم کی بود؟ 📅",
                options: ["بله مگه میشه یادم بره! ❤️", "تقریبا یادمه 🤔"]
            },
            {
                question: "سوال دوم: آماده‌ای برای دیدن نامه؟ 💌",
                options: ["آره زود باش! 😍", "بله حتماً ✨"]
            }
        ];

        // ۳. جملات چرخشی زیر کهکشان
        const galaxyPhrases = [
            "تعداد ستاره‌های این کهکشان، حتی نزدیک به میزان دوست داشتنت هم نیست... 🌌",
            "تو مثل ماه، ماهِ آسمونِ منی... ✨",
            "من دورت بگردم عزیزم... 🌙💫"
        ];

        // ==========================================
        // کدهای اصلی (دست نزن)
        // ==========================================
        const lockCard = document.getElementById('lock-card');
        const lockInput = document.getElementById('lock-date-input');
        const unlockBtn = document.getElementById('unlock-btn');
        const quizCard = document.getElementById('quiz-card');
        const letterCard = document.getElementById('letter-card');

        unlockBtn.addEventListener('click', () => {
            if (lockInput.value.trim() === CORRECT_DATE || lockInput.value.trim() !== "") {
                lockCard.classList.add('hidden');
                quizCard.classList.remove('hidden');
            }
        });

        let currentQIndex = 0;
        function renderQuestion() {
            if (currentQIndex < questions.length) {
                const q = questions[currentQIndex];
                document.getElementById('question-text').innerText = q.question;
                const container = document.getElementById('options-container');
                container.innerHTML = '';
                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-option';
                    btn.innerText = opt;
                    btn.onclick = () => { currentQIndex++; renderQuestion(); };
                    container.appendChild(btn);
                });
            } else {
                quizCard.classList.add('hidden');
                letterCard.classList.remove('hidden');
            }
        }
        renderQuestion();

        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const jokeModal = document.getElementById('joke-modal');

        function escapeYesButton() {
            const maxX = window.innerWidth - yesBtn.offsetWidth - 40;
            const maxY = window.innerHeight - yesBtn.offsetHeight - 40;
            yesBtn.style.position = 'fixed';
            yesBtn.style.left = Math.max(20, Math.floor(Math.random() * maxX)) + 'px';
            yesBtn.style.top = Math.max(20, Math.floor(Math.random() * maxY)) + 'px';
        }
        yesBtn.addEventListener('mouseover', escapeYesButton);
        yesBtn.addEventListener('touchstart', (e) => { e.preventDefault(); escapeYesButton(); });

        noBtn.addEventListener('click', () => jokeModal.classList.remove('hidden'));
        document.getElementById('modal-confirm-btn').addEventListener('click', () => {
            jokeModal.classList.add('hidden');
            letterCard.classList.add('hidden');
            init3D();
        });

        function init3D() {
            document.getElementById('galaxy-screen').classList.remove('hidden');
            document.getElementById('bg-music').play().catch(()=>{});

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 4.5;

            const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('moon-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            // بافت سه بعدی ماه
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#888888'; ctx.fillRect(0, 0, 1024, 512);
            for (let i = 0; i < 500; i++) {
                ctx.beginPath();
                ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*10+2, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(30, 30, 30, 0.3)';
                ctx.fill();
            }

            const moon = new THREE.Mesh(
                new THREE.SphereGeometry(1.8, 64, 64),
                new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(canvas), roughness: 0.8 })
            );
            scene.add(moon);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(5, 3, 5);
            scene.add(ambientLight); scene.add(dirLight);

            // ستاره‌ها
            const starsGeo = new THREE.BufferGeometry();
            const posArray = new Float32Array(1500 * 3);
            for(let i=0; i<4500; i++) posArray[i] = (Math.random() - 0.5) * 80;
            starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starMesh = new THREE.Points(starsGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.08}));
            scene.add(starMesh);

            function animate() {
                requestAnimationFrame(animate);
                moon.rotation.y += 0.003;
                starMesh.rotation.y += 0.0002;
                renderer.render(scene, camera);
            }
            animate();

            let pIndex = 0;
            const txt = document.getElementById('galaxy-text');
            txt.innerText = galaxyPhrases[0];
            setInterval(() => {
                pIndex = (pIndex + 1) % galaxyPhrases.length;
                txt.style.opacity = '0';
                setTimeout(() => { txt.innerText = galaxyPhrases[pIndex]; txt.style.opacity = '1'; }, 800);
            }, 4000);
        }
    </script>
</body>
</html>
